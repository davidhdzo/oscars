<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi Checklist de los Oscars · Mejor Película</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0a0a0c;
    --panel: #141319;
    --panel2: #1b1a21;
    --border: #2b2833;
    --border2: #3a3542;
    --text: #f3efe6;
    --muted: #a29b8f;
    --faint: #6f6a60;
    --gold: #d9b24a;
    --gold-bright: #f2dc93;
    --gold-deep: #a8842f;
    --win-bg: rgba(217,178,74,.10);
    --track: #26232c;
    --serif: "Didot", "Bodoni 72", "Playfair Display", "Hoefler Text", Garamond, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 16px; line-height: 1.5;
    background-image: radial-gradient(1200px 500px at 50% -8%, rgba(217,178,74,.10), transparent 70%);
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 22px 80px; }

  /* ── Cabecera ── */
  header { text-align: center; margin-bottom: 26px; }
  .oscar { font-size: 46px; line-height: 1; filter: drop-shadow(0 2px 10px rgba(217,178,74,.45)); }
  h1 {
    font-family: var(--serif); font-weight: 600; font-size: clamp(30px, 6vw, 46px);
    margin: 12px 0 6px; letter-spacing: .01em; text-wrap: balance;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold) 55%, var(--gold-deep));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--muted); font-size: 15px; margin: 0; }
  .sub b { color: var(--gold); font-weight: 600; }

  /* ── Progreso global ── */
  .progress-card {
    margin: 26px 0 10px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 20px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .progress-top .big { font-family: var(--serif); font-size: 26px; color: var(--text); }
  .progress-top .big b { color: var(--gold-bright); }
  .progress-top .pct { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 12px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--gold-deep), var(--gold) 50%, var(--gold-bright));
    border-radius: 999px; transition: width .4s ease; }

  /* ── Controles ── */
  .controls {
    position: sticky; top: 0; z-index: 5; margin: 18px -22px 0; padding: 12px 22px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  input[type="search"], select {
    font: inherit; font-size: 14px; color: var(--text);
    background: var(--panel2); border: 1px solid var(--border2); border-radius: 9px; padding: 9px 12px;
  }
  input[type="search"] { flex: 1 1 200px; min-width: 150px; }
  input[type="search"]::placeholder { color: var(--faint); }
  select:hover, input:hover { border-color: var(--gold-deep); }
  select:focus, input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 2px rgba(217,178,74,.25); }

  /* ── Año ── */
  .year { margin-top: 30px; scroll-margin-top: 74px; }
  .year-head { display: flex; align-items: baseline; gap: 12px; padding: 0 4px 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .year-head .yr { font-family: var(--serif); font-size: 30px; color: var(--gold-bright); line-height: 1; }
  .year-head .meta { color: var(--faint); font-size: 13px; }
  .year-head .count { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .year-bar { height: 4px; background: var(--track); border-radius: 999px; overflow: hidden; margin: 8px 4px 0; }
  .year-bar > span { display: block; height: 100%; background: var(--gold); border-radius: 999px; transition: width .3s; }

  /* ── Fila película ── */
  ul.films { list-style: none; margin: 6px 0 0; padding: 0; }
  li.film {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
    padding: 12px 12px; border-radius: 11px; border: 1px solid transparent;
  }
  li.film:hover { background: var(--panel); }
  li.film.win { background: var(--win-bg); border-color: rgba(217,178,74,.28); }
  li.film.seen .title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--gold-deep); }

  .chk { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 0; cursor: pointer;
    border: 2px solid var(--border2); border-radius: 6px; background: var(--panel2); position: relative; flex: none; transition: .12s; }
  .chk:hover { border-color: var(--gold); }
  .chk:checked { background: var(--gold); border-color: var(--gold); }
  .chk:checked::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: #1a1406; font-size: 15px; font-weight: 900; }
  .chk:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .info { min-width: 0; }
  .title { font-size: 16px; font-weight: 600; }
  .win-badge { color: var(--gold-bright); font-size: 12px; font-weight: 700; letter-spacing: .04em; margin-left: 7px; white-space: nowrap; }
  .dir { color: var(--faint); font-size: 13px; margin-top: 1px; }
  .note-btn { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 13px; padding: 2px 4px; margin-top: 2px; }
  .note-btn:hover { color: var(--gold); }
  .note-box { margin-top: 7px; }
  .note-box[hidden] { display: none; }
  .note-box input { width: 100%; font: inherit; font-size: 13.5px; color: var(--text);
    background: var(--panel2); border: 1px solid var(--border2); border-radius: 8px; padding: 7px 10px; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 5px 14px; align-items: center; margin-top: 5px; }
  .links { display: inline-flex; gap: 13px; flex-wrap: wrap; }
  .links a { color: var(--muted); font-size: 12.5px; text-decoration: none; white-space: nowrap; }
  .links a:hover { color: var(--gold); text-decoration: underline; }

  .stars { display: inline-flex; gap: 2px; flex: none; }
  .stars .s { cursor: pointer; font-size: 18px; line-height: 1; color: #3a3542; user-select: none; transition: color .1s, transform .1s; }
  .stars .s.on { color: var(--gold); }
  .stars .s:hover { transform: scale(1.18); }

  .empty { color: var(--faint); text-align: center; padding: 40px 0; }
  footer { color: var(--faint); font-size: 12.5px; text-align: center; margin-top: 44px; line-height: 1.7; }
  .reset { background: none; border: 1px solid var(--border2); color: var(--faint); border-radius: 8px; padding: 6px 11px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .reset:hover { border-color: var(--gold-deep); color: var(--gold); }
  @media (max-width: 520px) {
    .controls { margin: 18px -14px 0; padding: 10px 14px; }
    .wrap { padding: 28px 14px 60px; }
    li.film { grid-template-columns: auto 1fr; }
    .stars { grid-column: 2; justify-content: flex-start; margin-top: 2px; }
  }
</style>

<div class="wrap">
  <header>
    <div class="oscar">🏆</div>
    <h1>Mi Checklist de los Oscars</h1>
    <p class="sub">Todas las nominadas a <b>Mejor Película</b> · ceremonias 2000 – 2025</p>
  </header>

  <div class="progress-card">
    <div class="progress-top">

    </div>
    <div class="bar"><span id="p-fill"></span></div>
  </div>

  <div class="controls">
    <input type="search" id="q" placeholder="Buscar película o director…" aria-label="Buscar">
    <select id="filtro" aria-label="Filtrar">
      <option value="todas">Todas</option>
      <option value="pendientes">Solo pendientes</option>
      <option value="vistas">Solo vistas</option>
    </select>
    <select id="orden" aria-label="Orden">
      <option value="desc">Recientes primero</option>
      <option value="asc">Antiguas primero</option>
    </select>
    <select id="goto" aria-label="Ir a un año"><option value="">Ir al año…</option></select>
    <button class="reset" id="reset" type="button">Reiniciar</button>
  </div>

  <div id="lista"></div>

  <footer>
    Datos orientativos, compilados de memoria — puede haber algún error o hueco. La ceremonia de 2026 se añadirá cuando esté confirmada.<br>
    Tu progreso se guarda en este navegador. 🎬
  </footer>
</div>

        var qq = encodeURIComponent(t);
        html += '<li class="film' + (f[2] ? " win" : "") + (r.seen ? " seen" : "") + '" data-title="' + esc(t) + '">' +
          '<input type="checkbox" class="chk" ' + (r.seen ? "checked" : "") + ' aria-label="Marcar ' + esc(t) + ' como vista">' +
          '<div class="info">' +
            '<div><span class="title">' + esc(t) + '</span>' + (f[2] ? '<span class="win-badge">🏆 GANADORA</span>' : "") + '</div>' +
            '<div class="dir">' + esc(f[1]) + '</div>' +
            '<div class="meta-row">' +
              '<span class="links">' +
                '<a href="https://www.imdb.com/find/?q=' + qq + '&s=tt" target="_blank" rel="noopener noreferrer">IMDb ↗</a>' +
                '<a href="https://www.filmaffinity.com/es/search.php?stext=' + qq + '" target="_blank" rel="noopener noreferrer">FilmAffinity ↗</a>' +
                '<a href="https://www.justwatch.com/es/buscar?q=' + qq + '" target="_blank" rel="noopener noreferrer">▶ Dónde ver</a>' +
              '</span>' +
              '<button class="note-btn" data-act="note">📝 ' + (r.note ? "Nota: " + esc(r.note) : "Añadir nota") + '</button>' +
            '</div>' +
            '<div class="note-box" hidden><input type="text" value="' + esc(r.note || "") + '" placeholder="Tu comentario sobre la película…"></div>' +
          '</div>' +
          '<div class="stars" role="group" aria-label="Puntuación">' + starsHTML(r.rating) + '</div>' +
        '</li>';
      });
      html += "</ul></section>";
    });

    lista.innerHTML = anyShown ? html : '<p class="empty">No hay películas con ese filtro o búsqueda.</p>';
    updateGlobal();
  }

  // ── Eventos (delegación) ──
  lista.addEventListener("change", function (e) {
    if (e.target.classList.contains("chk")) {
      var li = e.target.closest(".film"); var t = li.getAttribute("data-title");
      var r = rec(t); r.seen = e.target.checked; put(t, r);
      li.classList.toggle("seen", r.seen);
      // Si un filtro oculta la fila, re-render; si no, solo actualiza progreso
      if (document.getElementById("filtro").value !== "todas") render(); else { updateGlobal(); updateYearBar(li); }
    }
  });
  lista.addEventListener("input", function (e) {
    if (e.target.matches(".note-box input")) {
      var li = e.target.closest(".film"); var t = li.getAttribute("data-title");
      var r = rec(t); r.note = e.target.value; put(t, r);
      li.querySelector('[data-act="note"]').textContent = "📝 " + (r.note ? "Nota: " + r.note : "Añadir nota");
    }
  });
  lista.addEventListener("click", function (e) {
    var star = e.target.closest(".s");
    if (star) {
      var li = e.target.closest(".film"); var t = li.getAttribute("data-title");
      var val = parseInt(star.getAttribute("data-star"), 10);
      var r = rec(t); r.rating = (r.rating === val) ? 0 : val; put(t, r);
      var group = li.querySelector(".stars");
      group.querySelectorAll(".s").forEach(function (s) {
        s.classList.toggle("on", parseInt(s.getAttribute("data-star"), 10) <= r.rating);
      });
      return;
    }
    var nb = e.target.closest('[data-act="note"]');
    if (nb) { var box = nb.nextElementSibling; box.hidden = !box.hidden; if (!box.hidden) box.querySelector("input").focus(); }
  });

  function updateYearBar(li) {
    var section = li.closest(".year"); if (!section) return;
    var yr = parseInt(section.querySelector(".yr").textContent, 10);
    var y = DATA.find(function (d) { return d.c === yr; });
    var seen = y.n.filter(function (f) { return rec(f[0]).seen; }).length;
    section.querySelector(".count").textContent = seen + "/" + y.n.length;
    section.querySelector(".year-bar > span").style.width = Math.round(seen / y.n.length * 100) + "%";
  }

  // Selector "Ir al año"
  var goto = document.getElementById("goto");
  goto.innerHTML = '<option value="">Ir al año…</option>' +
    DATA.slice().sort(function (a, b) { return b.c - a.c; }).map(function (y) { return '<option value="' + y.c + '">' + y.c + '</option>'; }).join("");
  goto.addEventListener("change", function () {
    var v = this.value;
    if (v) { var el = document.getElementById("y" + v); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
    this.value = "";
  });

  ["q", "filtro", "orden"].forEach(function (id) { document.getElementById(id).addEventListener("input", render); });
  document.getElementById("reset").addEventListener("click", function () {
    if (!confirm("¿Borrar todo tu progreso (vistas, notas y puntuaciones)?")) return;
    store = {}; saveStore(); render();
  });

  render();
})();
</script>
</body>
</html>
